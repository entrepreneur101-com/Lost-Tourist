name: lost_tourist
description: Snap a photo to find where you are.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  image_picker: ^1.1.0
  geolocator: ^12.0.0
  flutter_tts: ^4.0.2
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.0
  google_mlkit_text_recognition: ^0.13.0
  google_mlkit_language_id: ^0.11.0
  google_mlkit_translation: ^0.11.0
flutter:
  uses-material-design: true